spring.application.name=${SPRING_APPLICATION_NAME}
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}
spring.jackson.date-format=${SPRING_JACKSON_DATE_FORMAT}
spring.jackson.serialization.write-dates-as-timestamps=${SPRING_JACKSON_SERIALIZATION_WRITE_DATES_AS_TIMESTAMPS}
server.forward-headers-strategy=framework

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

rate.limit.enabled=${RATE_LIMIT_ENABLED}
rate.limit.per-second=${RATE_LIMIT_PER_SECOND}
rate.limit.burst=${RATE_LIMIT_BURST}
rate.limit.cooldown-seconds=${RATE_LIMIT_COOLDOWN_SECONDS}

auto.block.enabled=${AUTO_BLOCK_ENABLED}
auto.block.failure-threshold=${AUTO_BLOCK_FAILURE_THRESHOLD}
auto.block.failure-window-seconds=${AUTO_BLOCK_FAILURE_WINDOW_SECONDS}
auto.block.pattern-threshold=${AUTO_BLOCK_PATTERN_THRESHOLD}
auto.block.pattern-window-seconds=${AUTO_BLOCK_PATTERN_WINDOW_SECONDS}
auto.block.ua-unique-threshold=${AUTO_BLOCK_UA_UNIQUE_THRESHOLD}
auto.block.ua-window-seconds=${AUTO_BLOCK_UA_WINDOW_SECONDS}
auto.block.block-seconds=${AUTO_BLOCK_BLOCK_SECONDS}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

plaync.base-url=${PLAYNC_BASE_URL}
plaync.connect-timeout-ms=${PLAYNC_CONNECT_TIMEOUT_MS}
plaync.read-timeout-ms=${PLAYNC_READ_TIMEOUT_MS}
plaync.character-info-path=${PLAYNC_CHARACTER_INFO_PATH}
plaync.character-equipment-path=${PLAYNC_CHARACTER_EQUIPMENT_PATH}
plaync.character-search-path=${PLAYNC_CHARACTER_SEARCH_PATH}
plaync.character-equipment-item-path=${PLAYNC_CHARACTER_EQUIPMENT_ITEM_PATH}
plaync.character-daevanion-detail-path=${PLAYNC_CHARACTER_DAEVANION_DETAIL_PATH}
plaync.board-update-list-path=${PLAYNC_BOARD_UPDATE_LIST_PATH}
plaync.community-base-url=${PLAYNC_COMMUNITY_BASE_URL}
plaync.board-update-article-path=${PLAYNC_BOARD_UPDATE_ARTICLE_PATH}