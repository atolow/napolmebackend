# env 미설정 시 기본값 사용. EC2에서는 --env-file 로 실제 값 전달 권장.
spring.application.name=${SPRING_APPLICATION_NAME:napolme}
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE:Asia/Seoul}
spring.jackson.date-format=${SPRING_JACKSON_DATE_FORMAT:yyyy-MM-dd'T'HH:mm:ss}
spring.jackson.serialization.write-dates-as-timestamps=${SPRING_JACKSON_SERIALIZATION_WRITE_DATES_AS_TIMESTAMPS:false}
server.forward-headers-strategy=framework

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.per-second=${RATE_LIMIT_PER_SECOND:10}
rate.limit.burst=${RATE_LIMIT_BURST:20}
rate.limit.cooldown-seconds=${RATE_LIMIT_COOLDOWN_SECONDS:60}

auto.block.enabled=${AUTO_BLOCK_ENABLED:true}
auto.block.failure-threshold=${AUTO_BLOCK_FAILURE_THRESHOLD:50}
auto.block.failure-window-seconds=${AUTO_BLOCK_FAILURE_WINDOW_SECONDS:300}
auto.block.pattern-threshold=${AUTO_BLOCK_PATTERN_THRESHOLD:30}
auto.block.pattern-window-seconds=${AUTO_BLOCK_PATTERN_WINDOW_SECONDS:300}
auto.block.ua-unique-threshold=${AUTO_BLOCK_UA_UNIQUE_THRESHOLD:200}
auto.block.ua-window-seconds=${AUTO_BLOCK_UA_WINDOW_SECONDS:300}
auto.block.block-seconds=${AUTO_BLOCK_BLOCK_SECONDS:1800}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/napolme?serverTimezone=Asia/Seoul}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

plaync.base-url=${PLAYNC_BASE_URL:https://aion.plaync.com}
plaync.connect-timeout-ms=${PLAYNC_CONNECT_TIMEOUT_MS:5000}
plaync.read-timeout-ms=${PLAYNC_READ_TIMEOUT_MS:10000}
plaync.character-info-path=${PLAYNC_CHARACTER_INFO_PATH:/character/info}
plaync.character-equipment-path=${PLAYNC_CHARACTER_EQUIPMENT_PATH:/character/equipment}
plaync.character-search-path=${PLAYNC_CHARACTER_SEARCH_PATH:/character/search}
plaync.character-equipment-item-path=${PLAYNC_CHARACTER_EQUIPMENT_ITEM_PATH:/character/equipment/item}
plaync.character-daevanion-detail-path=${PLAYNC_CHARACTER_DAEVANION_DETAIL_PATH:/character/daevanion/detail}
plaync.board-update-list-path=${PLAYNC_BOARD_UPDATE_LIST_PATH:/board/updates}
plaync.community-base-url=${PLAYNC_COMMUNITY_BASE_URL:https://aion.plaync.com}
plaync.board-update-article-path=${PLAYNC_BOARD_UPDATE_ARTICLE_PATH:/board/article}
